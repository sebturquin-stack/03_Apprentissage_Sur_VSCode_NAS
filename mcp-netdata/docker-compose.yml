# ============================================================
#  MCP – Monitoring Connector for Netdata
#  Version : Production
#  Compose spec: sans champ `version` (Compose v2+)
#  Validation: Docker Compose v5.1.4
#  Auteur  : Sébastien
#  Objectif : Conteneur Node.js stable, durci, monitoré
# ============================================================

services:

  netdata-mcp:
    container_name: 01_Node-20_MCP

    # -----------------------------
    # Build
    # -----------------------------
    build:
      context: .
      dockerfile: Dockerfile

    image: netdata-mcp:local
    entrypoint: ["/usr/local/bin/node", "/app/netdata-mcp.js"]
    command: []

    # -----------------------------
    # Sécurité & Permissions
    # -----------------------------
    user: "1000:1000"
    security_opt:
      - apparmor:docker-mcp
    stdin_open: false
    tty: false

    # -----------------------------
    # Variables d’environnement
    # -----------------------------
    environment:
      NETDATA_BASE_URL: ${NETDATA_BASE_URL:-http://172.17.0.1:19999}

    # -----------------------------
    # Limites & Durcissement
    # -----------------------------
    cpus: 0.20
    mem_limit: 300m

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    restart: on-failure:5

    # -----------------------------
    # Healthcheck
    # -----------------------------
    healthcheck:
      test: ["CMD", "node", "/app/netdata-mcp.js", "--healthcheck"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 20s

    # -----------------------------
    # Réseau
    # -----------------------------
    networks:
      - mcp-net

# ============================================================
# Réseaux
# ============================================================

networks:
  mcp-net:
    driver: bridge





